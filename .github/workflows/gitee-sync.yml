name: Gitee 镜像同步

# 插件仓的 Gitee 镜像（用户在 auto 模式下可能从 Gitee 拉 index.json）。
# 镜像滞后 = 用户看到旧索引、装不到新插件，或装到旧版。
#
# 前置：配置 secrets.GITEE_TOKEN（Gitee 私人令牌，projects 写权限）。

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 推送到 Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::未配置 secrets.GITEE_TOKEN，无法同步 Gitee 镜像"
            exit 1
          fi
          git remote add gitee "https://tdcq9594:${GITEE_TOKEN}@gitee.com/tdcq9594/qq-bot-roost-plugins.git"
          git push gitee "HEAD:main" --force

      - name: 校验 Gitee 分支已跟上本次提交
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          for i in $(seq 1 10); do
            SHA=$(curl -fsSL "https://gitee.com/api/v5/repos/tdcq9594/qq-bot-roost-plugins/branches/main?access_token=${GITEE_TOKEN}" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).commit.sha)}catch{console.log('')}})") || true
            if [ "$SHA" = "${GITHUB_SHA}" ]; then echo "✓ Gitee 已同步到 ${GITHUB_SHA:0:8}"; exit 0; fi
            echo "等待 Gitee 同步…（当前 ${SHA:0:8}，期望 ${GITHUB_SHA:0:8}）"; sleep 6
          done
          echo "::error::Gitee 分支未跟上 ${GITHUB_SHA}，镜像可能滞后"; exit 1
