name: Gitee 镜像同步

# 插件仓的 Gitee 镜像（用户在 auto 模式下可能从 Gitee 拉 index.json）。
# 镜像滞后 = 用户看到旧索引、装不到新插件，或装到旧版。
#
# 两种模式（跟主仓一致）：
#   配了 secrets.GITEE_TOKEN → 自动推到 Gitee，再校验
#   没配                    → 只校验镜像有没有跟上（Gitee 公开仓可匿名查），不推送
#
# 校验比的是**内容指纹**（顶层 tree 条目 path→sha），不是 commit SHA。
# 原因：网络不通时我们会用 GitHub API 提交（同内容会得到不同 commit SHA），
# 那种情况镜像其实已经是最新的，只比 SHA 会假红。
# 任何嵌套改动都会让顶层 tree 的 sha 变化，所以指纹等价于全量内容比对。

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 推送到 Gitee（没配令牌就跳过）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::warning::未配置 secrets.GITEE_TOKEN，跳过自动推送；下面只校验镜像是否已跟上"
            exit 0
          fi
          git remote add gitee "https://tdcq9594:${GITEE_TOKEN}@gitee.com/tdcq9594/qq-bot-roost-plugins.git"
          git push gitee "HEAD:main" --force

      - name: 校验 Gitee 分支已跟上本次提交
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          # 公开仓可以匿名查；有令牌就带上，省得将来转私有后失效
          QS=""
          if [ -n "$GITEE_TOKEN" ]; then QS="?access_token=${GITEE_TOKEN}"; fi
          API="https://gitee.com/api/v5/repos/tdcq9594/qq-bot-roost-plugins"

          # 本地顶层条目（path → sha）。任何嵌套改动都会让顶层 tree 的 sha 变，
          # 所以这份清单就是「内容指纹」。
          EXPECTED=$(git ls-tree HEAD | awk '{print $4" "$3}' | sort)

          for i in $(seq 1 10); do
            HEAD_SHA=$(curl -fsSL "${API}/branches/main${QS}" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).commit.sha)}catch{console.log('')}})") || true

            if [ "$HEAD_SHA" = "${GITHUB_SHA}" ]; then
              echo "✓ Gitee 已同步到 ${GITHUB_SHA:0:8}"; exit 0
            fi

            if [ -n "$HEAD_SHA" ]; then
              ACTUAL=$(curl -fsSL "${API}/git/trees/${HEAD_SHA}${QS}" \
                | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).tree.map(e=>e.path+' '+e.sha).sort().join('\n'))}catch{console.log('')}})") || true
              if [ -n "$ACTUAL" ] && [ "$ACTUAL" = "$EXPECTED" ]; then
                echo "✓ Gitee 内容已一致（commit 不同：${HEAD_SHA:0:8} vs ${GITHUB_SHA:0:8}）"; exit 0
              fi
            fi

            echo "等待 Gitee 同步…（当前 ${HEAD_SHA:0:8}，期望 ${GITHUB_SHA:0:8}）"; sleep 6
          done
          echo "::error::Gitee 分支未跟上 ${GITHUB_SHA}，镜像滞后——手动 push 一下 Gitee，或配置 secrets.GITEE_TOKEN 让它自动推"
          exit 1
