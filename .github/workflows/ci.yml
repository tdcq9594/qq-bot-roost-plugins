name: CI

# 插件仓库的检查。主仓库那套（语法/单测/e2e）在这里跑不了——
# 插件依赖主仓库的框架，单独 checkout 没有 src/。
#
# 所以这里只管插件仓库自己能验证的事：
#   1. 语法别写错
#   2. 改了内容要升版本号（市场只比版本号，不升版等于没发）
#   3. 索引和插件目录对得上（sha256 一致）

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 版本检查要和上一个 commit 比，得拿到历史
          fetch-depth: 2

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: 语法检查
        shell: bash
        run: |
          fail=0
          for f in $(find plugins scripts -type f \( -name '*.js' -o -name '*.mjs' \) 2>/dev/null); do
            node --check "$f" || { echo "语法错误: $f"; fail=1; }
          done
          exit $fail

      - name: 改了内容要升版本号
        shell: bash
        run: |
          # push 到 main 时比 HEAD~1；PR 时比目标分支的合并基点
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --depth=1 origin "${{ github.base_ref }}"
            node scripts/check-versions.mjs --base "origin/${{ github.base_ref }}"
          else
            node scripts/check-versions.mjs --base HEAD~1
          fi

      - name: 索引与插件目录一致
        shell: bash
        # 索引里的 sha256 必须和插件目录的真实内容对得上，
        # 否则用户装的时候会校验失败（那是我们自己的错，不该让用户撞上）。
        # 哈希算法在 scripts/build-index.mjs 里，和框架的 src/hashdir.js 同一套；
        # 以前这段是内联在 yml 里的第二份实现，两份漏改一边就会互相打架。
        run: node scripts/build-index.mjs --check

      - name: 索引签名有效
        shell: bash
        # 签名是「这份索引没被改过」的全体属性。
        #
        # 以前 CI 只查 sha256，不查签名——于是「没有私钥就重生成索引」这条路
        # 会悄悄改掉 `updated` 让签名失效，而配了公钥的用户市场会直接变空，
        # 我们这边却全绿。
        #
        # 这里用的是**公钥**（仓库根的 trust-public.pem，可以公开）；
        # 私钥只在发版的人手里，`keys/` 已在 .gitignore 里。
        run: node scripts/sign-index.mjs --verify --key trust-public.pem

  # 插件自己的断言测试。
  #
  # 夹具（src/plugin/testkit.js）在框架仓库里，所以先把框架 checkout 到
  # .framework/，再用 ROOST_FRAMEWORK 指过去。插件仓库不复制夹具，
  # 免得两边版本漂移。
  test:
    name: 插件测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: 取框架（测试夹具在那边）
        uses: actions/checkout@v4
        with:
          repository: tdcq9594/qq-bot-roost
          path: .framework
          # 固定到已发布的框架 tag，而不是默认分支 HEAD。
          # 否则会出现：框架 master 有插件依赖的新能力但还没发布 → 插件 CI 假绿，
          # 用户装到旧版运行时坏；或 master 瞬时坏掉 → 插件 CI 假红。
          # **每次发框架新版都要改这里**（或设仓库 Variables 的 FRAMEWORK_REF 覆盖）。
          # 当前对应框架 v1.0.8（v1.0.7 起有 msg_type=8 图文卡片 replyTuwen；v1.0.6 起
          # 富媒体发图不再带占位空格；v1.0.4 起消息带 uin / userAliases，被动回复上限
          # 群 5 / 单聊 4，ai-chat 4.4.4 依赖它）。v1.0.8 只是修 1.0.7 里
          # 「实例锁把本进程显示成已退出」的判活回归，接口无变化。
          ref: ${{ vars.FRAMEWORK_REF || 'v1.0.8' }}

      - name: 跑插件测试
        shell: bash
        run: |
          fail=0
          for t in test/*.mjs; do
            case "$(basename "$t")" in
              kun-play.mjs) continue ;;   # 通关脚本只打印过程，不断言，不参与 CI
            esac
            echo "--- $t"
            ROOST_FRAMEWORK="$PWD/.framework" node "$t" || fail=1
          done
          exit $fail

      # 插件自带的测试也要跑。
      #
      # 以前只跑仓库根的 test/*.mjs，插件目录里的测试从来没进过 CI——
      # 而它们写死了 `../../../src/plugin/testkit.js`，只有在框架仓库内部才解析得到，
      # 就算手动跑也必然 ERR_MODULE_NOT_FOUND。douluo 的引擎/数据库一直没有防护。
      - name: 跑插件自带测试
        shell: bash
        run: |
          fail=0
          shopt -s nullglob
          for t in plugins/*/test/*.mjs; do
            case "$(basename "$t")" in
              _*.mjs) continue ;;          # 共享夹具，不是用例
            esac
            echo "--- $t"
            ROOST_FRAMEWORK="$PWD/.framework" node "$t" || fail=1
          done
          exit $fail

  # 换行符单独查：Windows 本地检出是 CRLF，一提交进去 sha256 就对不上了
  eol:
    name: 换行符检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 插件文件不应含 CRLF
        shell: bash
        run: |
          bad=$(git grep -Il $'\r' -- 'plugins/**' 'scripts/**' '*.json' '*.md' || true)
          if [ -n "$bad" ]; then
            echo "以下文件含 CRLF，请转成 LF："
            echo "$bad"
            exit 1
          fi
          echo "OK：没有 CRLF"
