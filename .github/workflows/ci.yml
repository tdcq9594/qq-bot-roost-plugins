name: CI

# 插件仓库的检查。主仓库那套（语法/单测/e2e）在这里跑不了——
# 插件依赖主仓库的框架，单独 checkout 没有 src/。
#
# 所以这里只管插件仓库自己能验证的事：
#   1. 语法别写错
#   2. 改了内容要升版本号（市场只比版本号，不升版等于没发）
#   3. 索引和插件目录对得上（sha256 一致）

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 版本检查要和上一个 commit 比，得拿到历史
          fetch-depth: 2

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: 语法检查
        shell: bash
        run: |
          fail=0
          for f in $(find plugins scripts -type f \( -name '*.js' -o -name '*.mjs' \) 2>/dev/null); do
            node --check "$f" || { echo "语法错误: $f"; fail=1; }
          done
          exit $fail

      - name: 改了内容要升版本号
        shell: bash
        run: |
          # push 到 main 时比 HEAD~1；PR 时比目标分支的合并基点
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --depth=1 origin "${{ github.base_ref }}"
            node scripts/check-versions.mjs --base "origin/${{ github.base_ref }}"
          else
            node scripts/check-versions.mjs --base HEAD~1
          fi

      - name: 索引与插件目录一致
        shell: bash
        # 索引里的 sha256 必须和插件目录的真实内容对得上，
        # 否则用户装的时候会校验失败（那是我们自己的错，不该让用户撞上）。
        # 哈希算法在 scripts/build-index.mjs 里，和框架的 src/hashdir.js 同一套；
        # 以前这段是内联在 yml 里的第二份实现，两份漏改一边就会互相打架。
        run: node scripts/build-index.mjs --check

  # 插件自己的断言测试。
  #
  # 夹具（src/plugin/testkit.js）在框架仓库里，所以先把框架 checkout 到
  # .framework/，再用 ROOST_FRAMEWORK 指过去。插件仓库不复制夹具，
  # 免得两边版本漂移。
  test:
    name: 插件测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: 取框架（测试夹具在那边）
        uses: actions/checkout@v4
        with:
          repository: tdcq9594/qq-bot-roost
          path: .framework
          # 固定到已发布的框架 tag，而不是默认分支 HEAD。
          # 否则会出现：框架 master 有插件依赖的新能力但还没发布 → 插件 CI 假绿，
          # 用户装到旧版运行时坏；或 master 瞬时坏掉 → 插件 CI 假红。
          # 发框架新版时改这里，或在仓库 Variables 里设 FRAMEWORK_REF 覆盖。
          ref: ${{ vars.FRAMEWORK_REF || 'v0.7.2' }}

      - name: 跑插件测试
        shell: bash
        run: |
          fail=0
          for t in test/*.mjs; do
            case "$(basename "$t")" in
              kun-play.mjs) continue ;;   # 通关脚本只打印过程，不断言，不参与 CI
            esac
            echo "--- $t"
            ROOST_FRAMEWORK="$PWD/.framework" node "$t" || fail=1
          done
          exit $fail

  # 换行符单独查：Windows 本地检出是 CRLF，一提交进去 sha256 就对不上了
  eol:
    name: 换行符检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 插件文件不应含 CRLF
        shell: bash
        run: |
          bad=$(git grep -Il $'\r' -- 'plugins/**' 'scripts/**' '*.json' '*.md' || true)
          if [ -n "$bad" ]; then
            echo "以下文件含 CRLF，请转成 LF："
            echo "$bad"
            exit 1
          fi
          echo "OK：没有 CRLF"
